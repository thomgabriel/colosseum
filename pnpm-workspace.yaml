packages:
  - apps/*
  - packages/*
  - contracts
allowBuilds:
  '@reown/appkit': false
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  keccak: false
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.15'
  - '@biomejs/cli-darwin-arm64@2.5.15'
  - '@biomejs/cli-darwin-x64@2.5.15'
  - '@biomejs/cli-linux-arm64-musl@2.5.15'
  - '@biomejs/cli-linux-arm64@2.5.15'
  - '@biomejs/cli-linux-x64-musl@2.5.15'
  - '@biomejs/cli-linux-x64@2.5.15'
  - '@biomejs/cli-win32-arm64@2.5.15'
  - '@biomejs/cli-win32-x64@2.5.15'
  - '@fastify/swagger@9.9.1'
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@scalar/client-side-rendering@0.4.7'
  - '@scalar/fastify-api-reference@1.72.3'
  - '@scalar/json-schema-validator@0.1.8'
  - '@scalar/openapi-parser@0.29.9'
  - '@scalar/openapi-validator@0.1.8'
  - '@scalar/types@0.22.3'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - next@16.3.8
  - vitest@5.0.3
# Advisories that `pnpm audit` reports and that are accepted for now. What each one is, whether we reach
# it and its fix: docs/vault/SECURITY-DEPS.md. security.yml fails on any high or critical advisory that is
# not in this list. A line comes out when its override lands (SEC-4 in the ledger).
overrides:
  # GHSA-96hv-2xvq-fx4p (high) and GHSA-58qx-3vcg-4xpx: the older viem copies under Privy's WalletConnect
  # pin ws 8.18. Only Node opens a socket with ws; a browser uses its own WebSocket.
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  # GHSA-68fv-2mgg-jv7q (high): source-map-js 1.2.1 under next's postcss. 1.2.2 is the fix, a patch.
  'source-map-js@<1.2.2': ^1.2.2
  # GHSA-q3jh-wrc6-jgq8 and GHSA-8r9p-f939-6h3c (high): follow-redirects 1.16.0 under Privy's wallet tree
  # (x402 > wagmi > @base-org/account > @coinbase/cdp-sdk > axios). 1.16.1 is the fix, a patch.
  'follow-redirects@>=1.16.0 <1.16.1': ^1.16.1
auditConfig:
  ignoreGhsas:
    - GHSA-rfgv-xxqx-mfg5 # undici, under @scalar/fastify-api-reference
    - GHSA-w293-vg96-wgc3 # undici, under @scalar/fastify-api-reference
    - GHSA-82x6-q7mm-w9cf # toml, under @kamino-finance/klend-sdk
    - GHSA-v5mp-jgw5-2x6j # toml, under @kamino-finance/klend-sdk
    - GHSA-4qx8-w7c3-pj3p # toml, under @kamino-finance/klend-sdk
    - GHSA-9j65-hcg3-gc64 # toml, under @kamino-finance/klend-sdk
    - GHSA-9qmh-m7c6-f92p # toml, under @kamino-finance/klend-sdk
    - GHSA-3gc7-fjrx-p6mg # bigint-buffer, under @kamino-finance/klend-sdk
