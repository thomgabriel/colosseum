# gitleaks, run by .github/workflows/security.yml. The default rules, plus what is known not to be a secret.
# A public address that trips a rule in new code: add its fingerprint to .gitleaksignore, with a comment.
[extend]
useDefault = true

[[allowlists]]
description = "Recorded chain data: transactions and accounts, full of base58 addresses and signatures. Only the generic rule is lifted here; a private key or a provider token in a fixture is still caught."
targetRules = ["generic-api-key"]
paths = ['''^fixtures/''']

[[allowlists]]
description = "The EVM deploy configs, the test network kit's record and the EVM deployment records: public addresses under keys such as `token`, `feed` and `tokenIssuer` (Deploy.s.sol reads `token`; EvmDeploymentRecord names `tokenIssuer`). Only the generic rule is lifted; a private key there is still caught."
targetRules = ["generic-api-key"]
paths = [
  '''^contracts/script/config/[0-9]+\.json$''',
  # Tokens a mainnet factory lists later through its timelock (AddAssets.s.sol): the same entries as the deploy file.
  '''^contracts/script/config/[0-9]+-assets-[0-9]+\.json$''',
  # The pool-average feeds' file (DeployPoolFeeds.s.sol): the same public addresses under `token` and `quoteToken`.
  '''^contracts/script/config/pool-feeds/[0-9]+\.json$''',
  '''^contracts/script/testnet/deployed/[0-9]+\.json$''',
  '''^deployments/(robinhood|base)-(testnet|local)\.json$''',
]
