effects:
  interaction-vocabulary: [seat-slide, pin-drop, hairline-deepen, species-press, underline-draw, part-and-close, crossfade-reduced]
  hover:
    card: "hairline-deepen — border hair → member (hair-d → member-d), no lift, no shadow"
    button: "species-press (rest) — primary bg → wood-600 #63482E (light) / #D7C09E (dark)"
    link: "underline-draw — 1px underline thickens to 2px, colour stays hardwood / hinoki"
    row: "background → {color.accent} (paper-sunk / char-2)"
  active:
    button: "species-press — bg → heartwood (light) / hinoki-deep (dark); no scale, no translate"
  focus:
    general: "2px solid {color.ring} outline, 2px offset, square corners"
    pin: "same ring around the 24x24 hit area; Enter opens the provenance popover"
  transition: "160ms for colour/opacity, 320ms for slides; cubic-bezier(0.2, 0, 0, 1); transform and opacity only for motion"
  choreography:
    plan-lock: "legs fade in at exploded positions (160ms, 60ms stagger) → slide and seat (280-360ms, ease-seat) → pin drops after 120ms over 160ms"
    why-this-plan: "part-and-close — pieces part 12-24px on their axes, callouts fade in, then close back to locked"
    loader: "lattice assembles: 3x3 P1-medium, horizontals slide on x then verticals drop on y, 240ms each, 60ms stagger, hold 400ms; only for waits > 400ms, with a text label and role=status"
    reduced-motion: "every slide becomes a 120ms crossfade; the pin appears without travel; loader is static + label"

