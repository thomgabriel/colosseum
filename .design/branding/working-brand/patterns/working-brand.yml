name: working-brand
display_name: Tenonfi  # provisional; fallback "Tenon". Slug stays working-brand for tooling.
description: Honey on night — one brand colour (fresh-cut hinoki in sunlight) on a cool near-black or warm paper, direction colours from the daylight photograph, Inter Tight and Inter, soft radii, gradients only as light, and a provenance pin on every number
tags: [joinery, honey, cool-dark, data-dense, provenance, light-dark-peers, fintech]
source: brand
generated: 2026-10-01
revised: 2026-10-08  # IDENTITY-2 (docs/GATES.md) replaces "The Open Joint" material register; LOGO-2 makes "the face" the mark

# ---------------------------------------------------------------------------
# What changed on 2026-10-08 and why (IDENTITY-2)
#   The first system sampled its palette from a studio photograph of wood in shadow
#   and banned every tool that makes a screen feel alive (a saturated accent, blue,
#   gradients, green and red, white, radius). It read dead. Benchmark for the UI
#   register: Meteora (cool near-black, one hot accent with 14-16% tints, signed
#   deltas in green and red, Inter, pills and small radii, the product in the first
#   viewport). The strategy is unchanged: made to measure, every joint shown.
#   Every value below traces to identity/color-system.md, palettes.json,
#   typography.md, imagery-style.md, iconography.md or logo-directions.md.
# ---------------------------------------------------------------------------

tokens:
  color:
    # Core — map 1:1 to shadcn/ui :root vars. Light mode = "day": warm paper, white cards.
    background: "#F7F5F0"           # paper
    foreground: "#15161C"           # ink (16.57 on paper)
    card: "#FFFFFF"                 # paper-2. White is allowed again
    card-foreground: "#15161C"
    popover: "#FFFFFF"
    popover-foreground: "#15161C"
    primary: "#F5A83A"              # honey — the one brand colour, both modes
    primary-foreground: "#15161C"   # ink on honey (9.06). Never white on honey (2.0)
    secondary: "#EFECE5"            # paper-3
    secondary-foreground: "#15161C"
    # accent = shadcn hover/selected surface = honey at 14% over the ground (opaque equivalent)
    accent: "#F7EAD6"
    accent-foreground: "#9D5A00"    # honey-l (5.39 on white)
    muted: "#EFECE5"                # paper-3 (table heads, input wells, code)
    muted-foreground: "#676A75"     # muted-l (5.39 on white)
    destructive: "#B52F44"          # madder-l (off track / error), 6.08 on white
    border: "#E3DFD6"               # line-l — hairlines, card edges
    input: "#C9C4B9"                # line-l2 — control edges (controls also carry a fill)
    ring: "#2A73B0"                 # chalk-l — the carpenter's line; focus only (5.03 on white)

    sidebar: "#F7F5F0"
    sidebar-foreground: "#15161C"
    sidebar-primary: "#F5A83A"
    sidebar-primary-foreground: "#15161C"
    sidebar-accent: "#F7EAD6"
    sidebar-accent-foreground: "#9D5A00"
    sidebar-border: "#E3DFD6"
    sidebar-ring: "#2A73B0"

    # Chart = plan legs (max 4) + base-case line
    chart-1: "#F5A83A"   # honey
    chart-2: "#D9881B"   # honey-deep
    chart-3: "#B9803F"   # wood-deep
    chart-4: "#676A75"   # muted-l
    chart-5: "#15161C"   # ink — base-case projection line (stress cases dashed muted / madder)

    # Extras → --success / --warning / --info
    success: "#117940"   # leaf-l — "On track" (+ solid square + word), 5.48 on white
    warning: "#A64618"   # clay-l — "Watch" (+ half-filled square + word), 5.98 on white
    info: "#2A73B0"      # chalk-l — guides, "today" lines, the test-network plate. Never a brand colour

  # Brand extension colours (not shadcn core; emitted as --tf-* custom props by the token mapping).
  brand-color:
    # grounds and lines
    night: "#0C0D12"
    night-2: "#13151C"
    night-3: "#1A1D26"
    line: "#262A36"
    line-2: "#363B4B"
    paper: "#F7F5F0"
    paper-2: "#FFFFFF"
    paper-3: "#EFECE5"
    line-l: "#E3DFD6"
    line-l2: "#C9C4B9"
    # text
    text: "#F3F1EC"        # on night (17.2 on night)
    muted: "#9A9DAD"       # on night (6.77 on night-2)
    muted-2: "#6E7282"     # on night: captions, placeholders, the pin's outline (large or non-text only)
    ink: "#15161C"         # on paper
    muted-l: "#676A75"     # on paper
    # the brand colour
    honey: "#F5A83A"
    honey-hover: "#E99C2E"
    honey-deep: "#D9881B"   # pressed, chart-2
    honey-l: "#9D5A00"      # honey as text or link on light grounds (5.39 on white)
    honey-tint: "rgba(245,168,58,0.14)"
    # direction colours (always with a word and a shape)
    leaf: "#3FC47C"
    leaf-l: "#117940"
    leaf-tint: "rgba(63,196,124,0.14)"
    clay: "#F0703A"
    clay-l: "#A64618"
    clay-tint: "rgba(240,112,58,0.14)"
    madder: "#EF5A6F"
    madder-l: "#B52F44"
    madder-tint: "rgba(239,90,111,0.14)"
    # the carpenter's line: guides, selection lines, focus, "today". Never a fill, never a brand element
    chalk: "#78B4E8"
    chalk-l: "#2A73B0"
    chalk-tint: "rgba(120,180,232,0.14)"
    # wood: imagery, the 3D joint and the logo's companion tones only. Not UI chrome
    wood: "#E9C48E"
    wood-deep: "#B9803F"
    # light as gradient (the only gradients allowed)
    glow: "radial-gradient(60% 90% at 78% 30%, rgba(245,168,58,0.22), rgba(245,168,58,0) 70%)"
    glow-l: "radial-gradient(60% 90% at 78% 30%, rgba(245,168,58,0.28), rgba(245,168,58,0) 70%)"
    curve-fill: "linear-gradient(to bottom, rgba(245,168,58,0.35), rgba(245,168,58,0))"

  scales:
    # Hex ramps for tints, badges and data. The named tokens above stay the source of truth for UI.
    honey: { 50: "#FFF6E6", 100: "#FFE9C2", 200: "#FFD48A", 300: "#F9BE5C", 400: "#F5A83A", 500: "#E99C2E", 600: "#D9881B", 700: "#B06C12", 800: "#85500C", 900: "#5C3707", 950: "#3A2204" }
    neutral: { 50: "#F7F5F0", 100: "#EFECE5", 200: "#E3DFD6", 300: "#C9C4B9", 400: "#9A9DAD", 500: "#6E7282", 600: "#4B4F5E", 700: "#363B4B", 800: "#262A36", 900: "#1A1D26", 950: "#0C0D12" }
    leaf: { 50: "#E8F8EE", 100: "#C9EFD9", 200: "#9AE1B8", 300: "#6AD39A", 400: "#3FC47C", 500: "#2AA866", 600: "#117940", 700: "#156236", 800: "#0F4727", 900: "#092E19", 950: "#051B0E" }
    clay: { 50: "#FEEFE7", 100: "#FDDACB", 200: "#FAB89A", 300: "#F5936A", 400: "#F0703A", 500: "#DA5F2A", 600: "#A64618", 700: "#964215", 800: "#6F310F", 900: "#4A200A", 950: "#2D1306" }
    madder: { 50: "#FDEDF0", 100: "#FBD6DC", 200: "#F7AEBA", 300: "#F38496", 400: "#EF5A6F", 500: "#DB4259", 600: "#B52F44", 700: "#9B2A3D", 800: "#70202D", 900: "#49151E", 950: "#2B0C12" }
    chalk: { 50: "#EAF4FC", 100: "#D1E6F8", 200: "#A8CFF1", 300: "#8FC1EC", 400: "#78B4E8", 500: "#4F93D0", 600: "#2A73B0", 700: "#1F588A", 800: "#174065", 900: "#0F2A43", 950: "#081827" }
    heatmap-dark: ["#1A1D26", "#5C3707", "#B06C12", "#F5A83A", "#FFE9C2"]   # low → high depth: night → honey → pale
    heatmap-light: ["#FFE9C2", "#F5A83A", "#B06C12", "#5C3707", "#1A1D26"]  # reversed

  typography:
    font-family-primary: '"Inter", "Inter Fallback", system-ui, -apple-system, "Segoe UI", Arial, sans-serif'
    font-family-display: '"Inter Tight", "Inter", system-ui, Arial, sans-serif'
    font-family-mono: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
    font-family-condensed: '"Inter Tight", "Inter", system-ui, sans-serif'   # Bearing heads and dense labels
    font-weight-heading: 600        # Inter Tight 600, −0.02em. Never a serif
    font-weight-body: 400
    font-weight-label: 500
    font-size-base: "16px"
    line-height-base: 1.5
    figures: "lining-nums tabular-nums in all UI; pinned figures always tabular lining; big numbers in Inter Tight 600"
    case: "sentence case everywhere; captions and column heads may be uppercase at 11-12px; the word MOCK never appears in the UI (gate MOCK-QUIET)"

    # Expressive register (marketing, plan view, API docs)
    scale-expressive:
      display: { face: display, weight: 600, size: "clamp(2.75rem, 2.2rem + 2.2vw, 4rem)", line-height: "1.05", tracking: "-0.025em" }
      h1: { face: display, weight: 600, size: "clamp(2.125rem, 1.8rem + 1.3vw, 2.875rem)", line-height: "1.1", tracking: "-0.02em" }
      h2: { face: display, weight: 600, size: "clamp(1.625rem, 1.45rem + 0.8vw, 2.125rem)", line-height: "1.15", tracking: "-0.02em" }
      h3: { face: display, weight: 600, size: "clamp(1.25rem, 1.15rem + 0.4vw, 1.5rem)", line-height: "1.25", tracking: "-0.015em" }
      h4: { face: primary, weight: 600, size: "1.125rem", line-height: "1.5rem", tracking: "-0.01em" }
      body-lg: { face: primary, weight: 400, size: "1.125rem", line-height: "1.75rem", tracking: "0" }
      body: { face: primary, weight: 400, size: "1rem", line-height: "1.5rem", tracking: "0" }
      body-sm: { face: primary, weight: 400, size: "0.875rem", line-height: "1.375rem", tracking: "0" }
      caption: { face: primary, weight: 500, size: "0.75rem", line-height: "1rem", tracking: "0.04em", transform: uppercase, note: "eyebrows and column heads only" }
      figure-lg: { face: display, weight: 600, size: "1.75rem", line-height: "2rem", tracking: "-0.02em", note: "the amount on a goal card" }
      sample-line: { face: primary, weight: 400, size: "0.78125rem", line-height: "1.25rem", tracking: "0", note: "a whole sample panel's or the embed's quiet line, muted; a card has its tag (sample-tag)" }
      source: { face: mono, weight: 400, size: "0.8125rem", line-height: "1.25rem", tracking: "0" }

    # Productive register (Bearing): 13px base, fixed
    scale-productive:
      b-kpi: { face: display, weight: 600, size: "1.375rem", line-height: "1.75rem", tracking: "-0.02em" }
      b-title: { face: display, weight: 600, size: "1.25rem", line-height: "1.75rem" }
      b-section: { face: primary, weight: 600, size: "0.9375rem", line-height: "1.5rem" }
      b-emph: { face: primary, weight: 600, size: "0.8125rem", line-height: "1.25rem" }
      b-cell: { face: primary, weight: 400, size: "0.8125rem", line-height: "1.25rem", values: "tabular" }
      b-head: { face: primary, weight: 500, size: "0.6875rem", line-height: "1rem", tracking: "0.05em", transform: uppercase }
      b-meta: { face: mono, weight: 400, size: "0.75rem", line-height: "1rem" }
      b-delta: { face: primary, weight: 500, size: "0.6875rem", line-height: "1rem", note: "signed, coloured leaf / madder, under the value" }

    # Embedded register (partner embed): partner font, em-relative
    scale-embedded:
      e-title: "1.44em"
      e-lead: "1.2em"
      e-body: "1em"        # disclaimer never smaller than this
      e-small: "0.8333em"  # provenance line
      e-credit: "max(0.6944em, 11px)"  # "Powered by tenonfi" only

    measure:
      body: "66ch"
      docs: "72ch"
      display: "16ch"

  shape:
    # Soft, not square. Joinery is carried by construction motifs, not by corners.
    border-radius-sm: "6px"      # tags on a dense row, inline code, the pin's outline
    border-radius-md: "8px"      # buttons, inputs, selects, popovers  → --radius
    border-radius-lg: "10px"     # cards, panels, table containers
    border-radius-xl: "16px"     # app tiles, hero media
    border-radius-pill: "9999px" # chips, status badges, filter tabs, the composer's send button
    border-radius-composer: "20px"   # the goal composer container and the subscribe field
    border-radius-asset: "9999px"   # → --tf-radius-asset. The circular token identification mark (AssetMark) only (Thom, 2026-10-07)
    border-width: "1px"
    focus-ring-width: "2px"
    focus-ring-offset: "2px"

  elevation:
    # No drop shadows in the app. Depth = three layers + hairlines + a 14% tint on the selected surface.
    shadow-sm: "none"
    shadow-md: "none"
    shadow-lg: "none"
    shadow-xl: "none"
    shadow-popover: "0 8px 24px rgba(0,0,0,0.35)"   # popovers and the composer only
    layers-light: ["#EFECE5", "#F7F5F0", "#FFFFFF"]  # sunk → ground → raised
    layers-dark: ["#0C0D12", "#13151C", "#1A1D26"]   # ground → surface → raised

  spacing:
    base: 4
    scale: [4, 8, 12, 16, 24, 32, 48, 64, 96]
    row-dense: "36px"        # Bearing rows: 20px line + 8px padding each side
    row-comfortable: "44px"
    grid-columns: 12
    hit-area-min: "24px"

  motion:
    duration-fast: "160ms"
    duration-normal: "320ms"
    easing: "cubic-bezier(0.2, 0, 0, 1)"  # --ease-seat
    delay-pin: "120ms"
    duration-reduced: "120ms"
    stagger: "60ms"

  # Patterns (structure only)
  pattern:
    p1-kumiko:
      use: "marketing section grounds only, as a faint hairline lattice (line / line-l at 60% opacity); never in the app, Bearing or the embed"
      cell: "1 column of the 12-col grid"
    p4-hatch:
      meaning: "sample (mock, sandbox) and stale ONLY — never decoration"
      angle: "45deg"
      stroke: "1px muted (night) / muted-l (day)"
      pitch-ui: "6px"
      pitch-glyph: "3px"
      band: "6px left edge band on a sample row or plan leg, a stale plate or a Bearing tile (not a card, since Oct 13); text never on strokes"
    p5-bracket-set: "Bearing imagery only (photo / render), never a repeat"
    dimension-lines: "45° ticks and Plex Mono values on drawings and exploded views; chalk / chalk-l"

  # Provenance pin: the logo's tenon end in line mode. Its own component, never in the icon registry.
  provenance:
    glyph: "viewBox 0 0 18 12; outline rect 3:2, stroke 1.5, radius 2.5; square pin 4x4 radius 1 set toward the end; height .75em (1cap); U+202F before it"
    live:
      light: { outline: "#C9C4B9", pin: "#9D5A00 solid square" }
      dark: { outline: "#6E7282", pin: "#F5A83A solid square" }
      paired: "popover: plain words first; source · fetched_at · method under Details (TOOLTIP-WORDS)"
    stale:
      light: { outline: "#C9C4B9", pin: "#9D5A00 hollow square, stroke 1.5" }
      dark: { outline: "#6E7282", pin: "#F5A83A hollow square" }
      paired: "the word 'stale' + age, always"
    mock:
      light: { outline: "#C9C4B9", fill: "45deg hatch #676A75, 3px pitch", pin: "none" }
      dark: { outline: "#6E7282", fill: "45deg hatch #9A9DAD", pin: "none" }
      paired: "aria-label 'sample figure'; the card's quiet line 'Sample figures' (gate MOCK-QUIET: never a boxed MOCK word); API carries \"provenance\": \"mock\""
    sandbox: "same as mock; the card's tag reads 'Test network'; the buy card says 'Test network · <chain> · not live'"
    embed: "pin in partner's muted text colour; the hatch and the sample line mandatory"
    a11y: "<button aria-label='Source for 6.4%'> (+ ', stale, 3 hours old' / ', mock data'); 24x24 hit area; Enter opens"

  # Goal state: word + shape + colour, never colour alone
  status:
    on-track: { light: "#117940", dark: "#3FC47C", tint: "rgba(63,196,124,0.14)", shape: "solid square", word: "On track" }
    watch: { light: "#A64618", dark: "#F0703A", tint: "rgba(240,112,58,0.14)", shape: "half-filled square", word: "Watch" }
    off-track: { light: "#B52F44", dark: "#EF5A6F", tint: "rgba(239,90,111,0.14)", shape: "square outline with a notch", word: "Off track" }
    delta: "signed (+ / U+2212), leaf for up, madder for down, muted for flat; always beside the value it qualifies"

dark_mode:
  color:
    # "night": a cool near-black, a trace of blue so honey glows instead of sinking.
    background: "#0C0D12"           # night
    foreground: "#F3F1EC"           # text (17.2)
    card: "#13151C"                 # night-2
    card-foreground: "#F3F1EC"
    popover: "#1A1D26"              # night-3
    popover-foreground: "#F3F1EC"
    primary: "#F5A83A"              # honey (9.75 on night)
    primary-foreground: "#15161C"   # ink on honey (9.06)
    secondary: "#1A1D26"            # night-3
    secondary-foreground: "#F3F1EC"
    accent: "#2D2318"               # honey at 14% over night (opaque equivalent); selected rows, chips
    accent-foreground: "#F5A83A"
    muted: "#1A1D26"
    muted-foreground: "#9A9DAD"     # muted (6.77 on night-2)
    destructive: "#EF5A6F"          # madder (5.88 on night)
    border: "#262A36"               # line
    input: "#363B4B"                # line-2
    ring: "#78B4E8"                 # chalk (8.77 on night)
    sidebar: "#13151C"
    sidebar-foreground: "#F3F1EC"
    sidebar-primary: "#F5A83A"
    sidebar-primary-foreground: "#15161C"
    sidebar-accent: "#2D2318"
    sidebar-accent-foreground: "#F5A83A"
    sidebar-border: "#262A36"
    sidebar-ring: "#78B4E8"
    chart-1: "#F5A83A"   # honey
    chart-2: "#E9C48E"   # wood
    chart-3: "#D9881B"   # honey-deep
    chart-4: "#9A9DAD"   # muted
    chart-5: "#F3F1EC"   # text — base-case line
    success: "#3FC47C"   # leaf (8.69 on night)
    warning: "#F0703A"   # clay (6.55)
    info: "#78B4E8"      # chalk

intensity:
  variance: 3     # 12-col grid, flush left; asymmetry from the empty third in heroes and the glow's off-centre
  motion: 3       # one vocabulary: slide on one axis, seat, pin drops. Purposeful, never ambient
  density: 4      # consumer airy; Bearing tight (13px type, 36px rows); docs between

patterns:
  card:
    border: "1px solid {color.border} (line / line-l)"
    shadow: "none"
    radius: "{shape.border-radius-lg} (10px)"
    background: "{color.card} (white / night-2)"
    padding: "24px consumer and docs; 16px Bearing tiles"
    rule: "no photography and no pattern inside; a card holds one goal, one leg or one tile"
  button-primary:
    background: "{color.primary} (honey); hover honey-hover #E99C2E; pressed honey-deep #D9881B"
    border: "none"
    text: "Inter 600, 14-15px, sentence case, ink #15161C on honey in both modes"
    radius: "{shape.border-radius-md} (8px)"
    height: "40px default, 32px dense"
    rule: "one primary per view; pills belong to chips, never to primary buttons"
  button-secondary:
    background: "transparent ({color.secondary} on hover)"
    border: "1px solid {color.input} (line-2 / line-l2)"
    text: "Inter 600, sentence case, {color.foreground}"
    radius: "{shape.border-radius-md} (8px)"
    hover: "background → {color.secondary}; border → muted"
  input:
    border: "1px solid {color.input}"
    radius: "{shape.border-radius-md} (8px)"
    background: "{color.secondary} (paper-3 / night-3) — the input well"
    focus: "2px solid {color.ring} (chalk) outline, 2px offset; border unchanged; no glow"
    error: "border {color.destructive} + a sentence saying what to change ('doesn't fit' — never blame)"
    text: "Inter 400 15-16px; values tabular; labels Inter 500 caption above, never placeholder-only"
  badge:
    shape: "pill, 22px tall, 14% tint of its colour as fill, the colour as text; leads with its square glyph"
    text: "Inter 600 11.5-12px, sentence case"
    status: "on track = solid square leaf · watch = half square clay · off track = notched outline madder"
    sample-tag: "Inter 500 12px foreground on honey-tint, 1px honey edge at 60%, a pill, as the portfolio overview's plate: 'Sample figures' or 'Test network', once per card in its top-right corner; no hatched card edge, no uppercase word (gate MOCK-QUIET, Thom, Oct 13)"
    chip: "filter chips are pills; selected = honey-tint fill + honey text, no border"
  nav:
    style: "plain horizontal bar on {color.background}, 1px hairline bottom; mark + wordmark left; the primary action right; no glass, no blur"
    links: "Inter 500 14px, {color.muted-foreground} → {color.foreground} on hover; active = foreground + 2px honey underline at 6px offset"
    docs: "left sidebar on {color.sidebar}, 1px {color.sidebar-border} right edge"
  layout:
    archetype: "asymmetric-grid"
    max-width: "1280px page; 66ch body; 72ch docs prose; 16ch display"
    section-spacing: "96px marketing; 64px docs and plan; 32px Bearing panels"
    grid-gap: "24px; 16px Bearing"
    surfaces: "night or paper, flat; a honey glow (brand-color.glow) behind heroes and the composer; P1 lattice on marketing grounds only"
    first-viewport: "the product, not a manifesto: the composer with a sample plan beneath it, numbers and pins visible before any scroll"
    decoration: "hairline rules, dimension lines with 45deg ticks and Plex Mono values (chalk), exploded views"

  # --- Brand-specific patterns ---
  provenance-pin:
    placement: "after every yield, price and FX figure, at cap height, U+202F thin no-break space between"
    states: "live = solid square pin · stale = hollow pin + 'stale · 3 h' · sample (mock) = hatched tenon, no pin, named 'sample figure', with the card's quiet line · sandbox = the same line with 'test network'"
    colour: "pin in honey (night) / honey-l (day); outline in muted-2 / line-l2; partner muted in the embed"
    popover: "plain words in Inter (what and where from, how fresh, whether live; stale first); under Details the API's source · fetched_at (UTC) · method, addresses only in Plex Mono; on night-3 / white, 1px border, shadow-popover (gate TOOLTIP-WORDS)"
  sample:
    rule: "gate MOCK-QUIET: one quiet tag in the card's top-right corner ('Sample figures', or 'Test network') + a hatched pin or glyph named 'sample figure'. Never a boxed MOCK word. Never styled like a live figure"
    surface: "the tag sits after the header's meta, or in a line of its own at the top right; hatch fills a 6px band only on rows, legs, stale plates and Bearing tiles"
  goal-card:
    anatomy: "eyebrow (caption: 'Apartment fund · Jun 2028') → amount in figure-lg + pin → one line (net yield · access to cash) → status pill → progress bar (honey on line)"
    never: "photography, patterns, leaderboards, a big APY as the headline, progress rings"
  plan-leg:
    bar: "stacked horizontal bar, max 4 legs, 2px ground-colour gap between segments, pill ends"
    colours-light: "honey, honey-deep, wood-deep, muted-l"
    colours-dark: "honey, wood, honey-deep, muted"
    labels: "direct label per leg (leg · weight · after-haircut yield + pin · 'quoted x%' muted), never legend-only"
    mock-leg: "hatched segment; its label says 'sample'"
  data-row:
    anatomy: "asset (avatar 22px, name 600, type chip) · sparkline coloured by direction (leaf / madder / muted) · values tabular with a signed delta beneath · status cell (pin, stale, MOCK)"
    selected: "honey-tint fill across the row"
  chart:
    base-case: "honey 2px line with curve-fill beneath"
    stress: "dashed muted and dashed madder"
    today: "1px dashed chalk vertical with a Plex Mono label"
    rule: "dashed = projected, solid = measured, everywhere; never a rainbow categorical palette"
  disclaimer:
    rule: "rendered from the DISCLAIMER constant, never paraphrased; hairline-boxed block directly under the plan and at the top of API reference; Inter 400 at body size (>= 1em in embed); never footer micro-text"
  embed:
    rule: "the brand recedes: partner colours, font, radius, buttons. Survives: pin + popover, the hatch with its sample line, hairline structure, disclaimer block, explorer links, 'Powered by' credit in partner muted colour with the 16 px cut"
  bearing-tile:
    anatomy: "b-head label → b-kpi value (Inter Tight 600) + pin + b-delta → b-meta line: unit · n= · method version · as-of UTC"
    surface: "night-2 on night, 1px line, 10px radius, 16px padding; no bevels, nameplates, LEDs or glow"

constraints:
  never:
    - "a yield, price or FX figure without its provenance pin (source · fetched_at · method)"
    - "a mock shown as live — no sample figure without its hatched pin or glyph and the card's sample tag; no text set on hatch strokes; no sandbox card without 'Test network'; no boxed MOCK word anywhere (gate MOCK-QUIET)"
    - "the hatch for anything but MOCK or stale"
    - "omit, shrink below body size, or paraphrase the disclaimer; present the brand as licensed advice; promise returns ('earn up to', 'guaranteed', 'risk-free')"
    - "a second brand colour: honey is the only accent. Chalk is a line, never a fill, a button or a brand element; no blue brand, no blue gradient. Exception: verified token identification artwork retains its original colours (Thom, Oct 7, INVEST-TWO-PANE), without extending the interface palette"
    - "two-hue gradients, glass, backdrop blur, neon glow, ambient orbs, gold foil, metallic or wood-grain fills in UI"
    - "white text on honey (2.0:1). Honey carries ink; as text on light grounds use honey-l"
    - "honey as the 'watch' colour, or any status shown by colour alone"
    - "cinnabar / vermilion / seal-red; Japanese clichés (kanji/kana as decoration, torii, ensō, hanko, sakura, waves, brush type, asanoha, kikkō, seigaiha, Japanese terms in product UI)"
    - "anything like Teiten: bevelled chassis, instrument nameplates, LEDs, screws, retro-OS panels, mono-led headlines"
    - "a serif anywhere in the app, Bearing or the embed. At most one serif line on the marketing site, by decision, not by default"
    - "patterns behind numbers, text, form fields, charts, the provenance popover or the disclaimer"
    - "pills on primary or secondary buttons; radius above 16px on anything but chips, badges and the composer"
    - "font weights below 400; centred or justified body text; uppercase except captions and column heads"
    - "text set on photographs; gradient scrims; duotones; wood-grain textures as backgrounds"
    - "bounce, spring, overshoot, confetti, counting-up figures, parallax, ambient loops"
    - "Sparkles/Wand/Rocket/Coins/TrendingUp/Shield-as-promise icons, RefreshCw for rebalance, emoji, exclamation marks, mascots, leaderboards"
    - "brand colour, patterns or photography inside the partner embed"
  always:
    - "one brand colour: honey, ink on it, in both modes; the pin is honey (night) or honey-l (day)"
    - "light and dark as peers — every component ships both and passes WCAG 2.2 AA in both"
    - "status = word + shape + colour (solid / half / notched square) on a 14% tint; deltas signed and coloured by direction"
    - "sample = the card's quiet tag 'Sample figures' + hatched pin or glyph named 'sample figure'; sandbox: the tag reads 'Test network'"
    - "stale = hollow pin + the word 'stale' + its age"
    - "the disclaimer from the single DISCLAIMER constant on the plan view and in API docs"
    - "Inter Tight for display and big numbers, Inter for UI, Plex Mono for provenance and code; tabular lining figures; true minus U+2212"
    - "colour sits in surfaces as 14% tints (selected rows, chips, badges), not only in text"
    - "a 2px chalk focus ring at 2px offset on every interactive element"
    - "the 4px grid; line heights snap to multiples of 4"
    - "dashed = projected, solid = measured or live — everywhere"
    - "every mainnet transaction line with its explorer link (Plex Mono, 'Tx ↗')"
    - "flush left, ragged right, sentence case; the product in the first viewport"

effects:
  interaction-vocabulary: [seat-slide, pin-drop, tint-rise, honey-press, underline-draw, part-and-close, crossfade-reduced]
  hover:
    card: "border line → line-2 (line-l → line-l2); no lift, no shadow"
    button: "honey-press — primary bg → honey-hover #E99C2E; secondary bg → secondary surface"
    link: "underline-draw — 1px underline thickens to 2px; colour honey (night) / honey-l (day)"
    row: "tint-rise — background → accent (honey at 14%)"
  active:
    button: "honey-press — bg → honey-deep #D9881B; no scale, no translate"
  focus:
    general: "2px solid {color.ring} (chalk) outline, 2px offset, follows the element's radius"
    pin: "same ring around the 24x24 hit area; Enter opens the provenance popover"
  transition: "160ms for colour/opacity, 320ms for slides; cubic-bezier(0.2, 0, 0, 1); transform and opacity only for motion"
  choreography:
    plan-lock: "legs fade in at exploded positions (160ms, 60ms stagger) → slide and seat (280-360ms) → pin drops after 120ms over 160ms"
    why-this-plan: "part-and-close — pieces part 12-24px on their axes, callouts fade in, then close back to locked"
    loader: "a 3-segment bar fills in honey, left to right, 240ms per segment; only for waits > 400ms, with a text label and role=status"
    reduced-motion: "every slide becomes a 120ms crossfade; the pin appears without travel; loader is static + label"

