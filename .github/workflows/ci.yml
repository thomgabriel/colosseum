name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Google's mirror of Docker Hub: Docker Hub and ECR Public both cap anonymous pulls, and CI hit both
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: colosseum
          POSTGRES_PASSWORD: colosseum
          POSTGRES_DB: colosseum
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U colosseum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # The same command a person or a session runs locally: lint, typechecks, tests, build.
      - run: pnpm verify
  # The app in a browser (apps/web/playwright.config.ts): the plan, buy and order screens at 375 px in
  # light and dark with axe, on the mock chain and a stub of the API. No database, no real sign-in.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @colosseum/web exec playwright install --with-deps chromium
      - run: pnpm --filter @colosseum/web e2e
        env: { CI: '1' }
      # The stub's mock as Robinhood Chain: the vault opened empty, an approval, then a deposit that buys (buy-robinhood.spec.ts).
      - run: pnpm --filter @colosseum/web e2e e2e/buy-robinhood.spec.ts
        env: { CI: '1', E2E_CHAIN: robinhood }
